<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Referensi — TRACER SMAGRISA</title>
<link rel="icon" id="favicon"><link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar">
    <div class="sb-brand"><img data-logo src="" alt=""><div><b data-cfg="NAMA_APLIKASI"></b><small>Admin Panel</small></div></div>
    <nav class="sb-nav" id="navList"></nav>
    <div class="sb-foot"><div class="sb-user"><div class="av">A</div><div><b id="sbUser">admin</b><small>Administrator</small></div></div>
      <button class="btn btn-sm" style="width:100%;background:rgba(255,255,255,.12);color:#fff" id="btnLogout"><i data-icon="logout"></i> Keluar</button></div>
  </aside>
  <div class="main">
    <header class="topbar"><h2>Referensi</h2><div class="right"><span class="chip"><i data-icon="clock"></i> Tahun Tracer <span id="tahunAktif"></span></span></div></header>
    <main class="content">
      <div class="info-banner" style="margin-bottom:16px"><i data-icon="info"></i> Sumber kebenaran adalah sheet referensi Spreadsheet. <b>data-referensi.js</b> adalah salinan statis frontend; perbarui lewat <code>generateReferensiJS()</code>.</div>
      <div class="ref-grid" id="refGrid"></div>
    </main>
  </div>
</div>
<div id="toasts" class="toast-wrap"></div>
<script src="js/config.js"></script><script src="js/icons.js"></script><script src="js/utils.js"></script>
<script src="js/data-referensi.js"></script><script src="js/mock-backend.js"></script><script src="js/api.js"></script><script src="js/admin-nav.js"></script>
<script>
initAdminShell('admin-referensi.html');
function list(title, items) {
  return '<div class="card pad"><h3>' + icon('db') + ' ' + title + ' (' + items.length + ')</h3><div class="ref-list">' + items.map(function (i) { return '<div class="ref-item"><code>' + esc(i.kode) + '</code><span>' + esc(i.label) + '</span></div>'; }).join('') + '</div></div>';
}
document.getElementById('refGrid').innerHTML =
  list('Bidang Usaha', REFERENSI.bidangUsahaList) +
  list('Jenis Pekerjaan', REFERENSI.jenisPekerjaanList) +
  list('Tingkat Penghasilan (7 kode resmi)', REFERENSI.tingkatPenghasilanList);
</script>
</body>
</html>
