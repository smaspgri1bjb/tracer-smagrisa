<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Tracer — TRACER SMAGRISA</title>
<link rel="icon" id="favicon"><link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar">
    <div class="sb-brand"><img data-logo src="" alt=""><div><b data-cfg="NAMA_APLIKASI"></b><small>Admin Panel</small></div></div>
    <nav class="sb-nav" id="navList"></nav>
    <div class="sb-foot"><div class="sb-user"><div class="av">A</div><div><b id="sbUser">admin</b><small>Administrator</small></div></div>
      <button class="btn btn-sm" style="width:100%;background:rgba(255,255,255,.12);color:#fff" id="btnLogout"><i data-icon="logout"></i> Keluar</button></div>
  </aside>
  <div class="main">
    <header class="topbar"><h2>Data Tracer</h2><div class="right"><span class="chip"><i data-icon="clock"></i> Tahun Tracer <span id="tahunAktif"></span></span></div></header>
    <main class="content">
      <div class="toolbar">
        <select class="select" id="fTahun" style="max-width:180px"></select>
        <select class="select" id="fStatus" style="max-width:200px"></select>
      </div>
      <div id="trcBody"><div class="empty"><div class="spinner" style="margin:0 auto"></div></div></div>
    </main>
  </div>
</div>
<div id="toasts" class="toast-wrap"></div>
<script src="js/config.js"></script><script src="js/icons.js"></script><script src="js/utils.js"></script>
<script src="js/data-referensi.js"></script><script src="js/mock-backend.js"></script><script src="js/api.js"></script><script src="js/admin-nav.js"></script>
<script>
initAdminShell('admin-tracer.html');
var FILTER = { tahunTracer: '', status: '' };
function badge(s) { var c = s === 'Bekerja' ? 'badge-blue' : s === 'Kuliah' ? 'badge-cyan' : s === 'Bekerja + Kuliah' ? 'badge-violet' : 'badge-slate'; return '<span class="badge ' + c + '">' + esc(s) + '</span>'; }
function render() {
  document.getElementById('trcBody').innerHTML = '<div class="empty"><div class="spinner" style="margin:0 auto"></div></div>';
  API.call('getTracerList', { filter: FILTER }).then(function (r) {
    var el = document.getElementById('trcBody');
    if (!r.ok) { el.innerHTML = '<div class="card empty">Gagal memuat.</div>'; return; }
    var rows = r.data;
    var fT = document.getElementById('fTahun'), fS = document.getElementById('fStatus');
    if (fT.options.length <= 1 && rows.length) {
      var yset = {}; rows.forEach(function (t) { yset[t.tahun_tracer] = 1; });
      fT.innerHTML = '<option value="">Semua Tahun</option>' + Object.keys(yset).sort().map(function (y) { return '<option>' + y + '</option>'; }).join('');
      fS.innerHTML = '<option value="">Semua Status</option>' + CONFIG.STATUS_LIST.map(function (s) { return '<option>' + s + '</option>'; }).join('');
    }
    if (!rows.length) { el.innerHTML = '<div class="card empty">' + icon('file') + '<b>Belum ada record tracer.</b></div>'; return; }
    el.innerHTML = '<div class="table-wrap card"><table class="tbl"><thead><tr><th>ID</th><th>Alumni</th><th>Th. Lulus</th><th>Th. Tracer</th><th>Tgl Isi</th><th>Nilai</th><th>Status</th></tr></thead><tbody>' +
      rows.map(function (t) {
        return '<tr><td style="font-family:monospace;font-size:11.5px">' + t.tracer_id + '</td><td><b>' + esc(t.nama) + '</b></td><td>' + t.tahun_lulus + '</td><td><span class="badge badge-blue">' + t.tahun_tracer + '</span></td><td>' + fmtDate(t.tanggal_isi) + '</td><td>' + t.nilai_rata_ijazah + '</td><td>' + badge(t.status_saat_ini) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  });
}
document.getElementById('fTahun').onchange = function (e) { FILTER.tahunTracer = e.target.value; render(); };
document.getElementById('fStatus').onchange = function (e) { FILTER.status = e.target.value; render(); };
render();
</script>
</body>
</html>
